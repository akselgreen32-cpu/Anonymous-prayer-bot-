<?xml version="1.0" encoding="UTF-8"?>
<!--
  BASE TEMPLATE for the Prayer Bot stats dashboard.

  main.py (render_stats_svg) loads this file and replaces every double-curly-brace
  placeholder with the real numbers. Everything else is the design, so you can
  open this file in a browser or in Inkscape/Figma and restyle it freely.

  Rules if you edit it:
    * Keep the placeholder names, they are matched by name. The bot refuses to
      build the picture if a placeholder is unknown, and the file must stay
      valid XML.
    * Canvas is 1080 x 1830. Each card is a group placed with translate(x,y);
      the generated charts inside use coordinates relative to that card, so if
      you resize a card also check the matching function in main.py.
    * Only widely supported SVG features are used (gradients, rounded
      rectangles, text, filters), so it opens the same everywhere.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1830" viewBox="0 0 1080 1830"
     font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Prayer Bot Dashboard</title>
  <desc>Prayer requests, users and subscriptions. Numbers only, never any prayer text.</desc>

  <defs>
    <!-- background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#0F192C"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.12" cy="0.04" r="0.62">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.92" cy="0.96" r="0.62">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#FFFFFF" fill-opacity="0.045"/>
    </pattern>

    <!-- cards -->
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18273F"/>
      <stop offset="1" stop-color="#132036"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="12" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-60%" y="-30%" width="220%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- brand colours (horizontal) -->
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#60C3FA"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#C77DFF"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16A34A"/><stop offset="1" stop-color="#5EEAA0"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#FDD35C"/>
    </linearGradient>
    <linearGradient id="gGray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64748B"/><stop offset="1" stop-color="#A9B8CC"/>
    </linearGradient>
    <linearGradient id="gRose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E11D48"/><stop offset="1" stop-color="#FB8BA0"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EA580C"/><stop offset="1" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D9488"/><stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>

    <!-- vertical bars for the 7-day chart -->
    <linearGradient id="barBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C8DF6"/><stop offset="1" stop-color="#2447B8"/>
    </linearGradient>
    <linearGradient id="barToday" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FE0FF"/><stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- logo -->
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- ===== background ===== -->
  <rect width="1080" height="1830" fill="url(#bg)"/>
  <rect width="1080" height="1830" fill="url(#glowBlue)"/>
  <rect width="1080" height="1830" fill="url(#glowPurple)"/>
  <rect width="1080" height="1830" fill="url(#dots)"/>

  <!-- ===== header ===== -->
  <circle cx="92" cy="104" r="50" fill="#60A5FA" fill-opacity="0.16"/>
  <circle cx="92" cy="104" r="38" fill="url(#logo)"/>
  <rect x="86" y="82" width="12" height="44" rx="4" fill="#FFFFFF"/>
  <rect x="74" y="94" width="36" height="12" rx="4" fill="#FFFFFF"/>
  <text x="156" y="100" font-size="46" font-weight="700" fill="#FFFFFF">Prayer Bot Dashboard</text>
  <text x="156" y="142" font-size="23" fill="#8CA0B8">{{DATE}}</text>

  <rect x="778" y="74" width="254" height="56" rx="28" fill="#22C55E" fill-opacity="0.13" stroke="#22C55E" stroke-opacity="0.45" stroke-width="1.5"/>
  <circle cx="808" cy="102" r="7" fill="#4ADE80"/>
  <text x="826" y="109" font-size="21" font-weight="600" fill="#BBF7D0">Updated {{TIME}}</text>

  <!-- ===== KPI tiles ===== -->
  <g transform="translate(48,200)">
    <rect width="222" height="170" rx="26" fill="url(#card)" stroke="#263A5A" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="28" y="0" width="64" height="5" rx="2.5" fill="url(#gBlue)"/>
    <text x="28" y="54" font-size="19" font-weight="600" letter-spacing="2" fill="#8CA0B8">TODAY</text>
    <text x="28" y="116" font-size="{{K_TODAY_FS}}" font-weight="800" fill="#7DD3FC">{{K_TODAY}}</text>
    <text x="28" y="148" font-size="18" fill="#8CA0B8">{{K_TODAY_SUB}}</text>
  </g>
  <g transform="translate(302,200)">
    <rect width="222" height="170" rx="26" fill="url(#card)" stroke="#263A5A" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="28" y="0" width="64" height="5" rx="2.5" fill="url(#gPurple)"/>
    <text x="28" y="54" font-size="19" font-weight="600" letter-spacing="2" fill="#8CA0B8">LAST 7 DAYS</text>
    <text x="28" y="116" font-size="{{K_WEEK_FS}}" font-weight="800" fill="#FFFFFF">{{K_WEEK}}</text>
    <text x="28" y="148" font-size="18" fill="#8CA0B8">{{K_WEEK_SUB}}</text>
  </g>
  <g transform="translate(556,200)">
    <rect width="222" height="170" rx="26" fill="url(#card)" stroke="#263A5A" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="28" y="0" width="64" height="5" rx="2.5" fill="url(#gGreen)"/>
    <text x="28" y="54" font-size="19" font-weight="600" letter-spacing="2" fill="#8CA0B8">LAST 30 DAYS</text>
    <text x="28" y="116" font-size="{{K_MONTH_FS}}" font-weight="800" fill="#FFFFFF">{{K_MONTH}}</text>
    <text x="28" y="148" font-size="18" fill="#8CA0B8">{{K_MONTH_SUB}}</text>
  </g>
  <g transform="translate(810,200)">
    <rect width="222" height="170" rx="26" fill="url(#card)" stroke="#263A5A" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="28" y="0" width="64" height="5" rx="2.5" fill="url(#gAmber)"/>
    <text x="28" y="54" font-size="19" font-weight="600" letter-spacing="2" fill="#8CA0B8">ALL TIME</text>
    <text x="28" y="116" font-size="{{K_ALL_FS}}" font-weight="800" fill="#FFFFFF">{{K_ALL}}</text>
    <text x="28" y="148" font-size="18" fill="#8CA0B8">{{K_ALL_SUB}}</text>
  </g>

  <!-- ===== last 7 days ===== -->
  <text x="48" y="432" font-size="20" font-weight="700" letter-spacing="3" fill="#7F93A8">LAST 7 DAYS</text>
  <g transform="translate(48,452)">
    <rect width="984" height="400" rx="30" fill="url(#card)" stroke="#263A5A" stroke-width="1.5" filter="url(#shadow)"/>
    {{WEEK_CHART}}
  </g>

  <!-- ===== categories ===== -->
  <text x="48" y="912" font-size="20" font-weight="700" letter-spacing="3" fill="#7F93A8">BY CATEGORY</text>
  <g transform="translate(48,932)">
    <rect width="588" height="520" rx="30" fill="url(#card)" stroke="#263A5A" stroke-width="1.5" filter="url(#shadow)"/>
    {{CATEGORY_ROWS}}
  </g>

  <!-- ===== users ===== -->
  <text x="668" y="912" font-size="20" font-weight="700" letter-spacing="3" fill="#7F93A8">USERS</text>
  <g transform="translate(668,932)">
    <rect width="364" height="520" rx="30" fill="url(#card)" stroke="#263A5A" stroke-width="1.5" filter="url(#shadow)"/>
    {{USERS_CARD}}
  </g>

  <!-- ===== message types ===== -->
  <text x="48" y="1504" font-size="20" font-weight="700" letter-spacing="3" fill="#7F93A8">MESSAGE TYPES</text>
  <g transform="translate(48,1524)">
    <rect width="588" height="220" rx="30" fill="url(#card)" stroke="#263A5A" stroke-width="1.5" filter="url(#shadow)"/>
    {{TYPE_CHIPS}}
  </g>

  <!-- ===== subscriptions ===== -->
  <text x="668" y="1504" font-size="20" font-weight="700" letter-spacing="3" fill="#7F93A8">SUBSCRIPTIONS</text>
  <g transform="translate(668,1524)">
    <rect width="364" height="220" rx="30" fill="url(#card)" stroke="#263A5A" stroke-width="1.5" filter="url(#shadow)"/>
    {{SUB_BARS}}
  </g>

  <!-- ===== footer ===== -->
  <line x1="48" y1="1782" x2="1032" y2="1782" stroke="#22334F" stroke-width="1.5"/>
  <text x="540" y="1814" font-size="18" text-anchor="middle" fill="#6B7F96">Anonymous Prayer bot  ·  owner dashboard  ·  numbers only, never prayer text</text>
</svg>
